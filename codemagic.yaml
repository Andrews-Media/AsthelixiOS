workflows:
  asthelix-ios-unsigned:
    name: Asthelix Digital Media - iOS build check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS app (unsigned)
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/AsthelixNative/AsthelixDigitalMedia.xcodeproj" \
            -scheme "AsthelixDigitalMedia" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - DerivedData/Build/Products/Debug-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
